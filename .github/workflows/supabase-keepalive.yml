# Keeps the free Supabase project from pausing after 7 quiet days, which
# would break share links. docs/ARCH-accounts-and-library.md §10.1
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 * * 1,4'     # Mon & Thu, 06:17 UTC
  workflow_dispatch:            # "Run workflow" button for testing
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository variables first."; exit 1
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/get_share" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{"slug":"keepalive0"}'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
